<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heavenfall・第一章 Demo（文字版）</title>
<style>
body{background:#14110f;color:#e8e0d0;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;margin:0;padding:12px;line-height:1.6}
#app{max-width:900px;margin:0 auto}
h1,h2,h3{margin:.4em 0;color:#f0c674}
button{background:#2a241f;color:#e8e0d0;border:1px solid #6b5a45;border-radius:6px;padding:6px 10px;margin:3px;cursor:pointer;font:inherit}
button:hover:not(:disabled){background:#3b3229;border-color:#f0c674}
button:disabled{opacity:.4;cursor:default}
.card{display:inline-block;vertical-align:top;width:190px;min-height:84px;text-align:left;white-space:normal}
.card .t{font-size:.82em;color:#b9a88f}
.card .n{font-weight:bold}
.page{display:inline-block;vertical-align:top;width:250px;min-height:90px;text-align:left}
.box{border:1px solid #3d342b;border-radius:8px;padding:8px 12px;margin:8px 0;background:#1b1714}
.log{font-size:.9em;color:#c9bca6;max-height:280px;overflow:auto;white-space:pre-wrap}
.hp{color:#e06c75}.qi{color:#61afef}.ap{color:#e5c07b}.hen{color:#c678dd}.arm{color:#98c379}.gold{color:#e5c07b}
.dim{color:#8a7d6b;font-size:.9em}
.bar span{margin-right:14px}
.say{border-left:3px solid #6b5a45;padding-left:10px;margin:8px 0}
.stage{position:fixed;left:0;right:0;top:28%;display:grid;justify-content:center;pointer-events:none;z-index:10}
.fcard{grid-area:1/1;position:relative;width:200px;min-height:120px;padding:10px 12px;border-radius:10px;background:#2a211a;border:2px solid #f0c674;box-shadow:0 0 24px rgba(240,198,116,.45);animation:fin .25s ease-out}
.fcard.foe{border-color:#e06c75;box-shadow:0 0 24px rgba(224,108,117,.5)}
.fcard.back{background:repeating-linear-gradient(45deg,#2a211a 0 8px,#221a14 8px 16px)}
.fcard .who{font-size:.78em;color:#b9a88f}.fcard .n{font-weight:bold;font-size:1.15em;color:#f0c674}.fcard .t{font-size:.82em;color:#b9a88f}
.fcard.ash{animation:burn .9s ease-in forwards}
.ashp{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffb35c;box-shadow:0 0 6px #ff8a2a;opacity:0;animation:fly 1s ease-out forwards}
@keyframes fin{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes burn{0%{filter:none}35%{filter:sepia(1) saturate(3) brightness(1.3);box-shadow:0 0 30px #ff8a2a}100%{filter:grayscale(1) brightness(.3) blur(3px);opacity:0;transform:translateY(-24px) scale(1.04)}}
@keyframes fly{0%{opacity:1;transform:none}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3);background:#555}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================= 基本工具 ================= */
const $app = document.getElementById('app');
const R = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = R(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a.slice()).slice(0, n);
const v = (u, a, b) => (u ? b : a);
let UID = 1;
const inst = (id, up = false) => ({ id, up, uid: UID++ });

/* ================= 可調數值 ================= */
const CFG = {
  startHp: 30, startAp: 1, startQi: 1, handSize: 3, henCap: 4,
  expTable: [0, 3, 7, 12, 18, 25],   // 到達 Lv(n+1) 所需累積經驗
  startGold: 10, pagesBeforeFinal: 10,
  price: { 1: 8, 2: 15, 3: 25 },
};

/* ================= 卡牌 =================
 type：武技(不耗資源) 身法(耗行動力) 神通(耗真氣) 吐納(補真氣) 反制(暗置) 兵器(裝備)
 ap/qi：消耗；apU/qiU：升級後消耗
*/
const CARDS = {
  // ---- 凡人卡組 ----
  quanjiao: { name: '拳腳', type: '武技', star: 1, text: u => `造成 ${v(u, 2, 3)} 傷害`, play: c => c.atk(v(c.u, 2, 3)) },
  gedang: { name: '格擋', type: '身法', star: 1, ap: 1, text: u => `獲得 ${v(u, 4, 6)} 護甲`, play: c => armor(c.me, v(c.u, 4, 6)) },
  tuna: { name: '吐納', type: '吐納', star: 1, text: u => `真氣 +${v(u, 2, 3)}`, play: c => gainQi(c.me, v(c.u, 2, 3)) },
  liaoshang: { name: '療傷', type: '神通', star: 1, qi: 2, text: u => `回復 ${v(u, 5, 8)} 生命`, play: c => heal(c.me, v(c.u, 5, 8)) },
  manjin: { name: '蠻勁', type: '神通', star: 1, qi: 1, text: u => `造成 ${v(u, 5, 7)} 傷害`, play: c => c.atk(v(c.u, 5, 7)) },
  // ---- 通用（商店/寶物/升級） ----
  feiti: { name: '飛踢', type: '武技', star: 1, text: u => `造成 ${v(u, 4, 6)} 傷害`, play: c => c.atk(v(c.u, 4, 6)) },
  lianhuan: { name: '連環拳', type: '武技', star: 1, text: u => `造成 1 傷害 ×${v(u, 3, 4)}`, play: c => c.atk(1, { hits: v(c.u, 3, 4) }) },
  zhamabu: { name: '紮馬步', type: '身法', star: 1, ap: 1, text: u => `獲得 ${v(u, 3, 5)} 護甲，抽 1 張`, play: c => { armor(c.me, v(c.u, 3, 5)); draw(c.me, 1); } },
  shenhuxi: { name: '深呼吸', type: '吐納', star: 1, text: u => `真氣 +${v(u, 3, 4)}`, play: c => gainQi(c.me, v(c.u, 3, 4)) },
  heshui: { name: '喝口水', type: '吐納', star: 1, text: u => `真氣 +1，抽 ${v(u, 1, 2)} 張`, play: c => { gainQi(c.me, 1); draw(c.me, v(c.u, 1, 2)); } },
  diushitou: { name: '丟石頭', type: '武技', star: 1, text: u => `造成 ${v(u, 1, 2)} 傷害，抽 1 張`, play: c => { c.atk(v(c.u, 1, 2)); draw(c.me, 1); } },
  lanlv: { name: '懶驢打滾', type: '反制', star: 1, ap: 1, apU: 0, text: u => `暗置。敵人下一張武技無效${u ? '（0 行動力）' : ''}`, trap: { trigger: 'attack', fire: () => ({ negate: true }) } },
  benpao: { name: '奔跑', type: '身法', star: 2, ap: 1, text: u => `行動力 +${v(u, 2, 3)}`, play: c => gainAp(c.me, v(c.u, 2, 3)) },
  caidao: { name: '菜刀', type: '兵器', star: 1, text: u => `每回合第一張武技 +${v(u, 2, 3)} 傷害`, eq: { firstAtkBonus: u => v(u, 2, 3) } },
  biandan: { name: '扁擔', type: '兵器', star: 1, text: u => `戰鬥開始獲得 ${v(u, 5, 8)} 護甲`, eq: { battleStart: u => armor(B.p, v(u, 5, 8)) } },
  baozi: { name: '熱包子', type: '吐納', star: 1, exile: true, text: u => `回復 ${v(u, 4, 6)} 生命。移除`, play: c => heal(c.me, v(c.u, 4, 6)) },
  cz_card: { name: '村長的叮囑', type: '神通', star: 2, qi: 1, qiU: 0, text: u => `抽 2 張，本回合下一張武技 +3 傷害`, play: c => { draw(c.me, 2); c.me.st.nextAtk = (c.me.st.nextAtk || 0) + 3; } },
  popi: { name: '潑皮手段', type: '武技', star: 1, text: u => `造成 ${v(u, 3, 4)} 傷害，銀兩 +1`, play: c => { c.atk(v(c.u, 3, 4)); if (c.me.isPlayer) G.gold += 1; } },

  // ---- 留痕 ----
  lh_huahen: { school: 'liuhen', name: '劃痕', type: '武技', star: 1, text: u => `造成 ${v(u, 2, 3)} 傷害，刻 1 痕`, play: c => { c.atk(v(c.u, 2, 3)); addHen(c.foe, 1, c.me); } },
  lh_lianci: { school: 'liuhen', name: '連刺', type: '武技', star: 1, text: u => `造成 1 傷害 ×${v(u, 3, 4)}`, play: c => c.atk(1, { hits: v(c.u, 3, 4) }) },
  lh_huifeng: { school: 'liuhen', name: '回鋒', type: '武技', star: 2, text: u => `造成 ${v(u, 3, 4)} 傷害；若目標痕已滿，抽 1 張`, play: c => { c.atk(v(c.u, 3, 4)); if (c.foe.hen >= c.foe.henCap) draw(c.me, 1); } },
  lh_luanhen: { school: 'liuhen', name: '亂痕', type: '武技', star: 2, text: u => `造成 1 傷害 ×X，X＝本回合已打出的武技數${u ? '+1' : ''}`, play: c => c.atk(1, { hits: (c.me.st.atkCount || 1) + v(c.u, 0, 1) }) },
  lh_pojia: { school: 'liuhen', name: '破甲痕', type: '武技', star: 2, text: u => `造成 ${v(u, 3, 4)} 穿刺傷害，刻 2 痕`, play: c => { c.atk(v(c.u, 3, 4), { pierce: true }); addHen(c.foe, 2, c.me); } },
  lh_yizi: { school: 'liuhen', name: '一字斬', type: '武技', star: 1, zhan: true, text: u => `斬：造成 4 + 每痕 ${v(u, 2, 3)} 傷害`, play: c => { const h = zhan(c); c.atk(4 + h * v(c.u, 2, 3)); } },
  lh_shizi: { school: 'liuhen', name: '十字斬', type: '武技', star: 2, zhan: true, text: u => `斬：造成（每痕 ${v(u, 2, 3)}）傷害 ×2，只清掉一半的痕`, play: c => { const h = zhan(c, true); c.atk(h * v(c.u, 2, 3), { hits: 2 }); } },
  lh_baihen: { school: 'liuhen', name: '百痕一斬', type: '武技', star: 3, zhan: true, text: u => `痕達上限才能打。斬：每痕 ${v(u, 5, 6)} 穿刺傷害`, req: c => c.foe.hen >= c.foe.henCap, play: c => { const h = zhan(c); c.atk(h * v(c.u, 5, 6), { pierce: true }); } },
  lh_youfeng: { school: 'liuhen', name: '游鋒', type: '身法', star: 1, ap: 1, text: u => `抽 2 張，下一張武技多刻 ${v(u, 1, 2)} 痕`, play: c => { draw(c.me, 2); c.me.st.nextHen = (c.me.st.nextHen || 0) + v(c.u, 1, 2); } },
  lh_cangfeng: { school: 'liuhen', name: '藏鋒', type: '身法', star: 1, ap: 1, text: u => `獲得 ${v(u, 5, 7)} 護甲，敵人每有 1 痕再 +1`, play: c => armor(c.me, v(c.u, 5, 7) + c.foe.hen) },
  lh_zhuihen: { school: 'liuhen', name: '追痕', type: '身法', star: 1, ap: 1, apU: 0, text: u => `從牌庫找 1 張「斬」加入手牌`, play: c => { const i = c.me.pile.findIndex(x => CARDS[x.id].zhan); if (i >= 0) { const x = c.me.pile.splice(i, 1)[0]; c.me.hand.push(x); log(`找到【${cname(x)}】`); } else log('牌庫裡沒有斬牌'); } },
  lh_xushi: { school: 'liuhen', name: '蓄勢', type: '身法', star: 2, ap: 1, text: u => `行動力 +2，抽 ${v(u, 1, 2)} 張`, play: c => { gainAp(c.me, 2); draw(c.me, v(c.u, 1, 2)); } },
  lh_henyin: { school: 'liuhen', name: '痕引', type: '身法', star: 2, ap: 1, text: u => `敵人需有 2 痕：消耗 2 痕，抽 2 張，行動力 +${v(u, 1, 2)}`, req: c => c.foe.hen >= 2, play: c => { c.foe.hen -= 2; draw(c.me, 2); gainAp(c.me, v(c.u, 1, 2)); } },
  lh_shihen: { school: 'liuhen', name: '拭痕', type: '身法', star: 1, ap: 1, apU: 0, text: u => `清除自己身上所有痕，每清 1 痕獲得 ${v(u, 2, 3)} 護甲`, play: c => { const n = c.me.hen; c.me.hen = 0; log(`${c.me.name} 拭去 ${n} 痕`); armor(c.me, n * v(c.u, 2, 3)); } },
  lh_jianqi: { school: 'liuhen', name: '劍氣縱橫', type: '神通', star: 2, qi: 3, qiU: 2, text: u => `刻 4 痕`, play: c => addHen(c.foe, 4, c.me) },
  lh_henlie: { school: 'liuhen', name: '痕裂', type: '神通', star: 2, qi: 2, qiU: 1, text: u => `本場戰鬥：敵人回合結束時，每痕受 1 穿刺傷害（可疊加）`, play: c => { c.foe.st.henlie = (c.foe.st.henlie || 0) + 1; } },
  lh_wuhen: { school: 'liuhen', name: '無痕', type: '神通', star: 3, qi: 5, qiU: 4, exile: true, text: u => `本回合「斬」不清痕。移除`, play: c => { c.me.st.wuhen = 1; } },
  lh_kairen: { school: 'liuhen', name: '開刃', type: '神通', star: 2, qi: 2, qiU: 1, text: u => `本場戰鬥敵人痕上限 +2`, play: c => { c.foe.henCap += 2; log(`${c.foe.name} 痕上限 → ${c.foe.henCap}`); } },
  lh_qianren: { school: 'liuhen', name: '千刃', type: '神通', star: 3, qi: 4, qiU: 3, exile: true, text: u => `本場戰鬥敵人痕上限 +4。移除`, play: c => { c.foe.henCap += 4; log(`${c.foe.name} 痕上限 → ${c.foe.henCap}`); } },
  lh_ningshen: { school: 'liuhen', name: '凝神', type: '吐納', star: 1, text: u => `真氣 +${v(u, 2, 3)}，抽 1 張`, play: c => { gainQi(c.me, v(c.u, 2, 3)); draw(c.me, 1); } },
  lh_guanhen: { school: 'liuhen', name: '觀痕', type: '吐納', star: 1, text: u => `真氣 +${v(u, 1, 2)}，敵人每 2 痕再 +1`, play: c => gainQi(c.me, v(c.u, 1, 2) + Math.floor(c.foe.hen / 2)) },
  lh_nihen: { school: 'liuhen', name: '逆痕', type: '反制', star: 2, ap: 1, apU: 0, text: u => `暗置。敵人下一張武技無效，並對它刻 2 痕`, trap: { trigger: 'attack', fire: t => { addHen(t.foe, 2, t.me); return { negate: true }; } } },
  lh_yihen: { school: 'liuhen', name: '移痕', type: '反制', star: 2, ap: 1, apU: 0, text: u => `暗置。下次有人對你刻痕時，改刻到對方身上`, trap: { trigger: 'hen' } },
  lh_kedao: { school: 'liuhen', name: '刻刀', type: '兵器', star: 1, text: u => `每回合第一張武技多刻 ${v(u, 1, 2)} 痕`, eq: { firstAtkHen: u => v(u, 1, 2) } },
  lh_jianxia: { school: 'liuhen', name: '殘劍匣', type: '兵器', star: 2, text: u => `每次打出「斬」，抽 ${v(u, 1, 2)} 張`, eq: { onZhan: u => draw(B.p, v(u, 1, 2)) } },
  lh_jiuqiao: { school: 'liuhen', name: '舊鞘', type: '兵器', star: 2, text: u => `戰鬥開始：敵人帶 2 痕，痕上限 +${v(u, 1, 2)}`, eq: { battleStart: u => { B.e.henCap += v(u, 1, 2); addHen(B.e, 2, B.p); } } },
  lh_henshi: { school: 'liuhen', name: '殘頁・痕噬', type: '武技', star: 3, zhan: true, text: u => `斬：每痕 ${v(u, 6, 7)} 傷害，自己失去「痕數×2」生命（被污染的殘頁，第 3 章可淨化）`, play: c => { const h = zhan(c); c.atk(h * v(c.u, 6, 7)); loseHp(c.me, h * 2); } },

  // ---- 負山 ----
  fs_hanshan: { school: 'fushan', name: '撼山拳', type: '武技', star: 1, text: u => `造成 ${v(u, 3, 4)} 傷害，獲得 ${v(u, 2, 3)} 護甲`, play: c => { c.atk(v(c.u, 3, 4)); armor(c.me, v(c.u, 2, 3)); } },
  fs_beishan: { school: 'fushan', name: '背山', type: '武技', star: 1, text: u => `造成等於一半護甲${u ? '+2' : ''}的傷害`, play: c => c.atk(Math.floor(c.me.armor / 2) + v(c.u, 0, 2)) },
  fs_xuequan: { school: 'fushan', name: '血拳', type: '武技', star: 1, text: u => `失去 2 生命，造成 ${v(u, 6, 8)} 傷害`, play: c => { loseHp(c.me, 2); c.atk(v(c.u, 6, 8)); } },
  fs_yishen: { school: 'fushan', name: '以身為盾', type: '武技', star: 2, text: u => `造成 ${v(u, 4, 5)} 傷害；生命低於一半時再獲得 ${v(u, 6, 8)} 護甲`, play: c => { c.atk(v(c.u, 4, 5)); if (c.me.hp < c.me.maxHp / 2) armor(c.me, v(c.u, 6, 8)); } },
  fs_bengshi: { school: 'fushan', name: '崩石', type: '武技', star: 2, beng: true, text: u => `崩：消耗全部護甲，造成等量${u ? '+3' : ''}傷害`, play: c => { const a = beng(c); c.atk(a + v(c.u, 0, 3)); } },
  fs_shanbeng: { school: 'fushan', name: '山崩地裂', type: '武技', star: 3, beng: true, text: u => `崩：消耗全部護甲，造成 2 倍${u ? '+5' : ''}穿刺傷害`, play: c => { const a = beng(c); c.atk(a * 2 + v(c.u, 0, 5), { pierce: true }); } },
  fs_lizhuang: { school: 'fushan', name: '立樁', type: '身法', star: 1, ap: 1, text: u => `獲得 ${v(u, 6, 9)} 護甲`, play: c => armor(c.me, v(c.u, 6, 9)) },
  fs_chenjian: { school: 'fushan', name: '沉肩', type: '身法', star: 1, ap: 1, text: u => `獲得 ${v(u, 4, 6)} 護甲，抽 1 張`, play: c => { armor(c.me, v(c.u, 4, 6)); draw(c.me, 1); } },
  fs_xuerou: { school: 'fushan', name: '血肉鑄甲', type: '身法', star: 2, ap: 1, text: u => `失去 3 生命，獲得 ${v(u, 10, 13)} 護甲`, play: c => { loseHp(c.me, 3); armor(c.me, v(c.u, 10, 13)); } },
  fs_huishan: { school: 'fushan', name: '回山', type: '身法', star: 2, ap: 1, apU: 0, text: u => `下回合開始時，護甲全部保留`, play: c => { c.me.st.huishan = 1; } },
  fs_zhenbu: { school: 'fushan', name: '震步', type: '身法', star: 2, ap: 1, text: u => `到你下回合前：每被攻擊一下，反震 ${v(u, 3, 5)} 傷害`, play: c => { c.me.st.fanzhen = (c.me.st.fanzhen || 0) + v(c.u, 3, 5); } },
  fs_budong: { school: 'fushan', name: '不動明身', type: '神通', star: 2, qi: 3, qiU: 2, text: u => `護甲翻倍`, play: c => armor(c.me, c.me.armor) },
  fs_shanhun: { school: 'fushan', name: '山魂', type: '神通', star: 3, qi: 4, qiU: 3, exile: true, text: u => `本場戰鬥每回合開始獲得 4 護甲。移除`, play: c => { c.me.st.shanhun = (c.me.st.shanhun || 0) + 1; } },
  fs_ranxue: { school: 'fushan', name: '燃血訣', type: '神通', star: 2, qi: 2, qiU: 1, text: u => `失去 5 生命，行動力 +2，抽 2 張`, play: c => { loseHp(c.me, 5); gainAp(c.me, 2); draw(c.me, 2); } },
  fs_shanyue: { school: 'fushan', name: '山嶽鎮', type: '神通', star: 2, qi: 3, qiU: 2, text: u => `敵人下回合行動力 -1`, play: c => { c.foe.st.apDown = 1; } },

    else if (k === 'disabled') el.disabled = !!val;
    else if (k === 'cls') el.className = val;
    else el.setAttribute(k, val);
  }
  for (const kid of kids.flat()) { if (kid === null || kid === undefined || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return el;
}

function mkUnit(o) { return Object.assign({ armor: 0, qi: 0, ap: 0, hen: 0, henCap: CFG.henCap, st: {}, traps: [], hand: [], pile: [], removed: [] }, o); }
function armor(u, n) { if (n <= 0) return; u.armor += n; log(`${u.name} 獲得 ${n} 護甲（${u.armor}）`); }
function heal(u, n) { const b = u.hp; u.hp = Math.min(u.maxHp, u.hp + n); log(`${u.name} 回復 ${u.hp - b} 生命`); }
function loseHp(u, n) { if (n <= 0) return; u.hp -= n; log(`${u.name} 失去 ${n} 生命`); }
function gainQi(u, n) { u.qi += n; log(`${u.name} 真氣 +${n}（${u.qi}）`); }
function gainAp(u, n) { u.ap += n; log(`${u.name} 行動力 +${n}（${u.ap}）`); }
function draw(u, n) { let k = 0; for (let i = 0; i < n && u.pile.length; i++) { u.hand.push(u.pile.pop()); k++; } if (u.isPlayer && k) log(`抽 ${k} 張`); }

function applyDamage(src, tgt, d, pierce, mods) {
  mods = mods || {};
  let blocked = 0;
  if (!pierce && tgt.armor > 0) { blocked = Math.min(tgt.armor, d); tgt.armor -= blocked; d -= blocked; }
  tgt.hp -= d;
  log(`${tgt.name} 受到 ${d} 傷害${blocked ? `（護甲擋下 ${blocked}）` : ''}${pierce ? '（穿刺）' : ''}`);
  if (mods.reflect && blocked > 0 && src) { src.hp -= blocked; log(`回震！${src.name} 受到 ${blocked} 傷害`); }
  return d;
}
function attack(src, tgt, base, o) {
  o = o || {};
  const hits = o.hits || 1, mods = o.mods || {};
  let bonus = o.bonus || 0, mult = 1;
  if (o.weapon) {
    if (src.st.nextAtk) { bonus += src.st.nextAtk; src.st.nextAtk = 0; }
    if (src.st.nextDouble) { mult = 2; src.st.nextDouble = 0; }
  }
  if (mods.armorFromDmg) armor(tgt, (base * hits + bonus) * mult);
  let total = 0;
  for (let i = 0; i < hits; i++) {
    if (tgt.hp <= 0 || src.hp <= 0) break;
    let d = (base + (i === 0 ? bonus : 0)) * mult;
    if (mods.halve) d = Math.floor(d / 2);
    total += applyDamage(src, tgt, d, o.pierce, mods);
    if (tgt.st.fanzhen && o.weapon) { log(`反震！`); applyDamage(tgt, src, tgt.st.fanzhen, false); }
    if (o.weapon && src.passive === 'liuhen' && hits >= 2) addHen(tgt, 1, src);
    if (o.weapon && src.st.ninghen) addHen(tgt, 1, src);
  }
  return total;
}
function addHen(t, n, src) {
  if (n <= 0 || t.hp <= 0) return;
  const ti = t.traps.findIndex(x => CARDS[x.card.id].trap.trigger === 'hen');
  if (ti >= 0 && src && src !== t) { flashCard(t.traps[ti].card, t.isPlayer ? 'me' : 'foe', `${t.name} 的反制觸發`); t.traps.splice(ti, 1); log(`【移痕】觸發！痕轉刻到 ${src.name} 身上`); t = src; }
  let add = 0;
  for (let i = 0; i < n && t.hp > 0; i++) {
    if (t.hen < t.henCap) { t.hen++; add++; continue; }
    if (add) log(`${t.name} 被刻下 ${add} 痕（${t.hen}/${t.henCap}）`);
    add = 0; t.hen = 0;
    log(`爆痕！${t.name} 身上的痕炸開`);
    applyDamage(null, t, t.henCap, true);
  }
  if (add) log(`${t.name} 被刻下 ${add} 痕（${t.hen}/${t.henCap}）`);
}

function beng(c) {

function equippedList() { return G.equipped.map(uid => G.deck.find(c => c.uid === uid)).filter(Boolean).map(ci => ({ ci, d: CARDS[ci.id] })); }
function equipHook(k) { for (const { ci, d } of equippedList()) if (d.eq && d.eq[k]) d.eq[k](ci.up); }
function equipSum(k) { let s = 0; for (const { ci, d } of equippedList()) if (d.eq && d.eq[k]) s += d.eq[k](ci.up); return s; }
function keepRatio() { let r = 0.5; for (const { d } of equippedList()) if (d.eq && d.eq.keep) r = Math.max(r, d.eq.keep()); return r; }

function canPlay(u, foe, ci) {
  const d = CARDS[ci.id], c = cost(d, ci.up);
  if (d.type === '兵器') return false;
  if (u.ap < c.ap || u.qi < c.qi) return false;
  if (d.req && !d.req({ me: u, foe, u: ci.up })) return false;

}
function resolveCard(me, foe, ci) {
  const d = CARDS[ci.id];
  if (d.type === '反制') { me.traps.push({ card: ci }); log(me.isPlayer ? `你暗置了【${cname(ci)}】` : `${me.name} 暗置了一張反制牌`); return; }
  let mods = {}, bonus = 0;
  const weapon = d.type === '武技';
  if (weapon) {
    me.st.atkCount = (me.st.atkCount || 0) + 1;
    const ti = foe.traps.findIndex(t => CARDS[t.card.id].trap.trigger === 'attack');
    if (ti >= 0) {
      const t = foe.traps.splice(ti, 1)[0];
      log(`${foe.name} 的反制【${cname(t.card)}】觸發！`);
      flashCard(t.card, foe.isPlayer ? 'me' : 'foe', `${foe.name} 的反制觸發`);
      mods = CARDS[t.card.id].trap.fire({ me: foe, foe: me, u: t.card.up }) || {};
    }
    if (mods.negate) { log(`【${cname(ci)}】被化解，無效`); return; }
    if (me.isPlayer && me.st.atkCount === 1) bonus += equipSum('firstAtkBonus');
  }
  const ctx = { me, foe, u: ci.up, ci,
    atk(base, o) { const r = attack(me, foe, base, Object.assign({ mods, bonus, weapon }, o || {})); mods = {}; bonus = 0; return r; } };
  d.play(ctx);
  if (weapon) {
    if (me.st.nextHen) { const n = me.st.nextHen; me.st.nextHen = 0; addHen(foe, n, me); }
    if (me.isPlayer && me.st.atkCount === 1) { const n = equipSum('firstAtkHen'); if (n) addHen(foe, n, me); }
  }
}

function startBattle(key, onWin) {
  const d = ENEMIES[key];
  const p = mkUnit({ name: G.name, isPlayer: true, maxHp: G.maxHp, hp: G.hp, apMax: G.apMax, qi: G.baseQi, passive: G.school });
  p.battleDeck = G.deck.filter(c => CARDS[c.id].type !== '兵器');
  const e = mkUnit({ name: d.name, maxHp: d.hp, hp: d.hp, apMax: d.ap, qi: d.qi, draw: d.draw, xihen: d.xihen });
  e.deck = d.deck.map(id => inst(id));
  B = { p, e, def: d, key, turn: 0, log: [], phase: 'player', onWin, stolen: 0, showEnemyDeck: false };
  log(`遭遇【${d.name}】（Lv${d.lv}）！`);
  if (d.intro) log(d.intro);
  for (const { ci, d: ed } of equippedList()) {
    if (ed.eq.battleStart) ed.eq.battleStart(ci.up);
    if (ed.eq.apMaxMod) p.apMax = Math.max(0, p.apMax + ed.eq.apMaxMod(ci.up));
  }
  if (G.pendingTuohen) { G.pendingTuohen = false; log('拓痕生效'); addHen(e, 2, p); }
  playerTurnStart();
  S = renderBattle; render();
}
function playerTurnStart() {
  const p = B.p; B.turn++;
  log(`—— 第 ${B.turn} 回合 ——`);
  if (B.turn > 1) {
    if (p.st.huishan) { p.st.huishan = 0; log('回山：護甲全部保留'); }
    else if (p.passive === 'fushan') { p.armor = Math.floor(p.armor * keepRatio()); if (p.armor) log(`山勢：保留 ${p.armor} 護甲`); }
    else p.armor = 0;
  }
  p.st.fanzhen = 0; p.st.atkCount = 0; p.st.ninghen = 0; p.st.wuhen = 0;
  if (p.st.shanhun) armor(p, 4 * p.st.shanhun);
  p.ap = Math.max(p.ap, p.apMax);
  const keep = new Set(p.hand.concat(p.removed).map(c => c.uid));
  p.pile = shuffle(p.battleDeck.filter(c => !keep.has(c.uid)));
  draw(p, G.handSize);
  B.phase = 'player';
}
function playerPlay(i) {
  if (B.phase !== 'player') return;
  const p = B.p, ci = p.hand[i];
  if (!canPlay(p, B.e, ci)) return;
  const c = cost(CARDS[ci.id], ci.up);
  p.ap -= c.ap; p.qi -= c.qi; p.hand.splice(i, 1);
  log(`▶ 你打出【${cname(ci)}】`);
  flashCard(ci, 'me', '你打出');
  resolveCard(p, B.e, ci);
  if (CARDS[ci.id].exile) p.removed.push(ci);
  if (!checkEnd()) render();
}
function endTurn() {
  if (B.phase !== 'player') return;
  if (B.p.hand.length > G.handSize) { B.phase = 'discard'; render(); return; }
  enemyTurn();
}
function discard(i) {
  const ci = B.p.hand.splice(i, 1)[0]; log(`棄掉【${cname(ci)}】`);
  if (B.p.hand.length <= G.handSize) enemyTurn(); else render();
}
const AI_ORDER = { '吐納': 0, '身法': 1, '神通': 1, '反制': 2, '武技': 3 };
function enemyTurn() {
  const e = B.e, p = B.p;
  B.phase = 'enemy';
  log(`—— ${e.name} 的回合 ——`);
  e.armor = 0; e.st.atkCount = 0;
  if (e.xihen && e.hen > 0) { log('吸痕！'); heal(e, e.hen); }
  e.ap = Math.max(0, e.apMax - (e.st.apDown || 0)); if (e.st.apDown) log(`${e.name} 被山嶽鎮壓，行動力 -1`); e.st.apDown = 0;
  const hand = pick(e.deck, e.draw).sort((a, b) => AI_ORDER[CARDS[a.id].type] - AI_ORDER[CARDS[b.id].type]);
  e.pile = shuffle(e.deck.filter(c => !hand.includes(c)));
  e.queue = hand;
  render();
  later(enemyStep, FX.step / 2);
}
function enemyStep() {
  const e = B.e, p = B.p;
  while (e.queue.length && e.hp > 0 && p.hp > 0) {
    const ci = e.queue.shift();
    if (!canPlay(e, p, ci)) { log(`（${e.name} 想打【${cname(ci)}】，但資源不足）`); continue; }
    const c = cost(CARDS[ci.id], ci.up); e.ap -= c.ap; e.qi -= c.qi;
    const trap = CARDS[ci.id].type === '反制';
    log(`◀ ${e.name} 打出【${trap ? '？？？' : cname(ci)}】${trap ? '' : '：' + CARDS[ci.id].text(ci.up)}`);
    flashCard(ci, 'foe', `${e.name} 打出`, trap);
    resolveCard(e, p, ci);
    render();
    later(e.hp > 0 && p.hp > 0 ? enemyStep : enemyEnd, FX.step);
    return;
  }
  enemyEnd();
}
function enemyEnd() {
  const e = B.e, p = B.p;
  if (e.hp > 0 && e.st.henlie && e.hen > 0) { log('痕裂！'); applyDamage(null, e, e.st.henlie * e.hen, true); }
  if (checkEnd()) return;
  playerTurnStart();
  render();
}
function checkEnd() {
  if (B.e.hp <= 0) { winBattle(); return true; }
  if (B.p.hp <= 0) { B.phase = 'over'; gameOver(); return true; }
  return false;
}
function useBattleSkill(sk) {
  G.skillCd[sk.id] = sk.cd; log(`發動技能【${sk.name}】`); sk.use(); if (!checkEnd()) render();
}

function winBattle() {
  B.phase = 'over';
  const d = B.def;
  G.hp = Math.max(1, B.p.hp);
  const gold = d.gold[0] + R(d.gold[1] - d.gold[0] + 1);
  G.gold += gold; G.exp += d.exp;
  for (const k in G.skillCd) if (G.skillCd[k] > 0) G.skillCd[k]--;
  G.flags['beat_' + B.key] = true;
  S = () => show(h('h2', null, `擊敗了 ${d.name}！`), h('div', { cls: 'box log' }, B.log.slice(-8).join('\n')),
    para(`獲得經驗 ${d.exp}、銀兩 ${gold}。`), btn('繼續', afterBattle));
  render();
}
function afterBattle() {
  if (G.level < CFG.expTable.length && G.exp >= CFG.expTable[G.level]) return levelUp();
  if (B.def.after && !B.afterDone) { B.afterDone = true; return EVENTS[B.def.after](); }
  B.onWin();
}

  G.level++; G.maxHp += 3; G.hp = G.maxHp;

    const pages = final ? [h('button', { cls: 'page', onclick: tournament }, h('div', { cls: 'n' }, '【劇情】武道大比'), h('div', { cls: 'dim' }, '凡人界的盡頭，武道界的入口。'))]
      : G.pageShown.map((k, i) => k ? h('button', { cls: 'page', onclick: () => (PAGES[k].fork ? takeFork(i) : PAGES[k].go(() => completePage(i))) },
        h('div', { cls: 'n' }, `【${PAGES[k].kind}】${PAGES[k].name}`), h('div', { cls: 'dim' }, PAGES[k].desc)) : null);
    show(h('h2', null, '第一章　凡人界・求仙'),
      h('div', { cls: 'dim' }, `旅途 ${Math.min(G.pagesDone, CFG.pagesBeforeFinal)}/${CFG.pagesBeforeFinal}　剩餘旅途頁 ${G.pageDeck.length}`),
      notice ? h('div', { cls: 'box' }, notice) : null,
      h('div', { cls: 'box' }, h('div', null, '選一頁前進：'), pages),
      h('div', { cls: 'box' }, btn('查看牌組／裝備兵器', () => deckScreen(mapScreen)),
        mapSkills.map(s => btn(`技能・${s.name}（${s.text}）${G.skillCd[s.id] ? `［冷卻 ${G.skillCd[s.id]} 場］` : ''}`, () => { G.skillCd[s.id] = s.cd; s.use(); notice = `發動【${s.name}】`; mapScreen(); }, !!G.skillCd[s.id]))));
    notice = '';
  };
  render();
}
function deckScreen(back) {
  S = () => {
    const eqs = G.deck.filter(c => CARDS[c.id].type === '兵器');
    const rest = G.deck.filter(c => CARDS[c.id].type !== '兵器');
    show(h('h2', null, `牌組（${rest.length} 張）`),
      h('div', { cls: 'box' }, rest.map(ci => cardBox(ci, null, false))),
      h('h3', null, `兵器（槽位 ${G.equipped.length}/${G.equipSlots}，點擊裝上／卸下；兵器不會進牌庫）`),
      h('div', { cls: 'box' }, eqs.length ? eqs.map(ci => { const on = G.equipped.includes(ci.uid);
        return cardBox(ci, () => { if (on) G.equipped = G.equipped.filter(x => x !== ci.uid); else if (G.equipped.length < G.equipSlots) G.equipped.push(ci.uid); render(); }, !on && G.equipped.length >= G.equipSlots, on ? '［已裝］' : ''); }) : '（沒有兵器）'),
      btn('返回', back));
  };
  render();
}
function pickCardScreen(title, desc, listFn, price, apply, done) {
  S = () => show(h('h2', null, title), para(desc),
    h('div', { cls: 'box' }, listFn().map(ci => cardBox(ci, () => { apply(ci); done(); }, G.gold < price))),
    btn('離開', done));
  render();
}
function shopScreen(done) {
  const stock = pick(cardPool(), 3).map(id => ({ id, sold: false }));
  let pill = false;
  S = () => show(h('h2', null, '遊方貨郎'), say('「走過路過不要錯過！正宗少林……呃，正宗拳譜！」'),
    h('div', { cls: 'box' }, stock.map(s => { const p = CFG.price[CARDS[s.id].star];
      return cardBox(inst(s.id), () => { G.gold -= p; s.sold = true; G.deck.push(inst(s.id)); render(); }, s.sold || G.gold < p, s.sold ? '［已售］' : `${p}兩・`); })),
    h('div', { cls: 'box' }, btn('金瘡藥（8 銀兩，回復 10 生命）', () => { G.gold -= 8; pill = true; G.hp = Math.min(G.maxHp, G.hp + 10); render(); }, pill || G.gold < 8)),
    btn('離開', done));
  render();
}

/* ================= 劇情節點 ================= */
function titleScreen() {
  G = null; B = null;
  S = () => show(h('h1', null, '天宗棄徒'), h('div', { cls: 'dim' }, '第一章 Demo（文字版）・規則仿《月圓之夜》・數值全部暫定'),
    say('父親臨終前只說了一句：「去天宗……替我問一句，為什麼。」'),
    say('他曾是天宗聖子，卻被廢去修為，丟在凡人界。二十年來，他再沒提過天宗兩個字。'),
    h('div', { cls: 'box' }, btn('林劍（兒子）', () => { newGame('林劍', 'm'); blessingScreen(); }), btn('林琴（女兒）', () => { newGame('林琴', 'f'); blessingScreen(); })),
    h('div', { cls: 'box dim' }, '快速體驗（跳過前面的旅途，直接到章末選流派、打首領）：',
      h('div', null, btn('快速：林劍', () => { newGame('林劍', 'm'); quickStart(); }), btn('快速：林琴', () => { newGame('林琴', 'f'); quickStart(); }))),
    h('div', { cls: 'box dim' }, rulesText()));
  render();
}
function rulesText() {
  return [h('div', null, '規則速記：'),
    h('div', null, '・每回合抽「手牌上限」張，回合結束手牌可保留到上限。除了手牌和被移除的牌，其餘每回合都洗回牌庫。'),
    h('div', null, '・武技不耗資源；身法耗行動力（每回合補到上限，多出的保留）；神通耗真氣（不會自動回，靠吐納累積）。'),
    h('div', null, '・反制牌打出後暗置，敵人打出武技時觸發。兵器戰前裝進兵器槽，不進牌庫；初始 0 槽。'),
    h('div', null, '・護甲在自己回合開始時清空（負山例外）。敵人跟你一樣有生命、真氣、行動力、牌組。'),
    h('div', null, '・擊敗敵人得經驗升級；卡牌從商店、包袱、升級、事件取得。')];
}
function blessingScreen() {
  const opts = pick([
    { t: '祖傳玉佩：生命上限 +6', f: () => { G.maxHp += 6; G.hp += 6; } },
    { t: '父親的手札：基礎真氣 +1', f: () => { G.baseQi += 1; } },
    { t: '私房錢：銀兩 +25', f: () => { G.gold += 25; } },
    { t: '舊扁擔：兵器槽 +1，獲得「扁擔」並裝上', f: () => { G.equipSlots += 1; const c = inst('biandan'); G.deck.push(c); G.equipped.push(c.uid); } },
    { t: '娘縫的護身符：升級 2 張起始牌', f: () => { pick(G.deck.filter(c => !c.up), 2).forEach(c => { c.up = true; }); } },
  ], 3);
  S = () => show(h('h2', null, '出發前'), say('收拾行囊時，你找到了幾樣東西。只能帶走一樣。'), h('div', { cls: 'box' }, opts.map(o => btn(o.t, () => { o.f(); mapScreen(); }))));
  render();
}
function quickStart() {
  G.level = 3; G.exp = 7; G.maxHp = 36; G.hp = 36; G.handSize = 4; G.gold = 30; G.baseQi = 2;
  ['feiti', 'zhamabu', 'shenhuxi'].forEach(id => G.deck.push(inst(id)));
  G.pagesDone = CFG.pagesBeforeFinal;
  tournament();
}
function tournament() {
  S = () => show(h('h2', null, '武道大比'),
    say('鎮上搭起了擂台，橫幅寫著：「第一屆武道界新人大比——贏了進武道界，輸了回家種田」。'),
    say('台下有兩位師父在招徒弟。'),
    ['liuhen', 'fushan'].map(k => { const s = SCHOOLS[k];
      return h('div', { cls: 'box' }, h('h3', null, `${s.name}「${s.motto}」— 師父 ${s.master}`), say(s.masterSay),
        h('div', { cls: 'dim' }, `流派被動：${s.passive}`),
        h('div', { cls: 'dim' }, `入門牌：${s.starter.map(id => CARDS[id].name).join('、')}　技能：${SKILLS[k].map(x => `Lv${x.lv}【${x.name}】${x.text}`).join('；')}`),
        btn(`拜入${s.name}`, () => chooseSchool(k))); }));
  render();
}
function chooseSchool(k) {
  G.school = k;
  SCHOOLS[k].starter.forEach(id => G.deck.push(inst(id)));
  const s = SCHOOLS[k];
  const ids = pick(schoolPool(k).filter(id => CARDS[id].type !== '兵器' && !s.starter.includes(id) && CARDS[id].star <= 2), 3);
  eventScreen(`拜入${s.name}`, [`${s.master}：「好，今天起你就是${s.name}的人了。上台前，再挑一招。」`, `（已加入入門牌：${s.starter.map(id => CARDS[id].name).join('、')}）`],
    ids.map(id => ({ t: `【${CARDS[id].name}】${stars(CARDS[id])}〔${CARDS[id].type}〕${CARDS[id].text(false)}`, f: () => { G.deck.push(inst(id)); bossIntro(); } })));
}
function bossIntro() {
  eventScreen('決賽', ['一路打到決賽，對面站著一個赤膊大漢，胸口紋著「鐵柱」兩個字。', '「趙鐵柱，連續三屆擂台霸主。新人，拳頭就是道理。」'], [
    { t: '整理牌組／兵器', f: () => deckScreen(bossIntro) },
    { t: '上台！', f: () => startBattle('boss', ending) },
  ]);
}
function ending() {
  S = () => show(h('h2', null, '第一章　完'),
    say('趙鐵柱躺在台上喘著粗氣：「你……不錯。去極武閣吧，那裡才是武道的頂點……」'),
    say('他頓了頓，壓低聲音：「不過……閣裡練到最深的那些人……已經不太像人了。」'),
    say('你握緊拳頭。父親的遺願，才剛開始。'),
    h('div', { cls: 'box' }, `本局：${SCHOOLS[G.school].name}・Lv${G.level}・牌組 ${G.deck.length} 張・道心 ${G.dao}・武魄 ${G.wu}・銀兩 ${G.gold}`),
    para('Demo 到此結束。第二章：極武閣（待製作）'), btn('再來一局', titleScreen));
  render();
}

titleScreen();
</script>
</body>
